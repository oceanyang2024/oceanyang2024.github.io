<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memorial Video Gallery</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      padding: 30px;
      margin: 0;
      background: url('https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 40px 20px;
      border-radius: 12px;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 2.2em;
      color: #5a4b81;
      margin-bottom: 10px;
    }

    .quote {
      text-align: center;
      font-style: italic;
      color: #6a5c88;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(90, 75, 129, 0.1);
      text-align: center;
      border: 1px solid #ddd;
    }

    video {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
    }

    .title {
      margin-top: 12px;
      font-size: 1.1rem;
      font-weight: normal;
      color: #4a4a4a;
    }

    @media (max-width: 600px) {
      .overlay {
        padding: 20px 10px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>In Loving Memory</h1>
    <div class="quote">“What we have once enjoyed deeply we can never lose. All that we love deeply becomes a part of us.” – Helen Keller</div>

    <div class="gallery" id="videoGallery"></div>
  </div>

  <script>
    const videos = [
	{ title: "Class of 2024", src: "video/v1.mp4" },
	{ title: "Wake County Interview", src: "video/v2.mp4" },
    ];

    const gallery = document.getElementById('videoGallery');

    videos.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const vid = document.createElement('video');
      vid.src = video.src;
      vid.controls = true;

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = video.title;

      card.appendChild(vid);
      card.appendChild(title);
      gallery.appendChild(card);
    });
  </script>

</body>
</html>
