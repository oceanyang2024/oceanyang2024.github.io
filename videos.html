<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memorial Video Gallery</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      padding: 30px;
      background-color: #f7f6f9;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 2em;
      color: #5a4b81;
      margin-bottom: 30px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }
    .video-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(90, 75, 129, 0.1);
      text-align: center;
      border: 1px solid #ddd;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
    }
    .title {
      margin-top: 12px;
      font-size: 1.1rem;
      font-weight: normal;
      color: #4a4a4a;
    }
  </style>
</head>
<body>

  <h1>In Loving Memory</h1>

  <div class="gallery" id="videoGallery"></div>

  <script>
    const videos = [
      { title: "Class of 2024", src: "videos/v1.mp4" },
      { title: "Wake County Interview", src: "videos/v2.mp4" },
    ];

    const gallery = document.getElementById('videoGallery');

    videos.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const vid = document.createElement('video');
      vid.src = video.src;
      vid.controls = true;

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = video.title;

      card.appendChild(vid);
      card.appendChild(title);
      gallery.appendChild(card);
    });
  </script>

</body>
</html>
