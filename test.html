<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Photo Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      padding: 1em;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .gallery img {
      width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    /* Lightbox overlay */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
    #lightbox:active {
      display: none;
    }
  </style>
</head>
<body>

  <h1>My Photo Gallery</h1>
  <div class="gallery">
    <img src="https://picsum.photos/id/1011/600/400" alt="Sample 1">
    <img src="https://picsum.photos/id/1015/600/400" alt="Sample 2">
    <img src="https://picsum.photos/id/1025/600/400" alt="Sample 3">
    <img src="https://picsum.photos/id/1035/600/400" alt="Sample 4">
    <img src="https://picsum.photos/id/1041/600/400" alt="Sample 5">
    <img src="https://picsum.photos/id/1050/600/400" alt="Sample 6">
  </div>

  <div id="lightbox">
    <img src="" alt="Full View">
  </div>

  <script>
    const galleryImages = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');

    galleryImages.forEach(img => {
      img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src;
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });
  </script>

</body>
</html>
