<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      padding: 1em;
      background: #333;
      color: white;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .video-thumb {
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    .video-thumb img {
      width: 100%;
      height: auto;
      display: block;
    }
    .video-thumb::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 40px;
      color: white;
      transform: translate(-50%, -50%);
      opacity: 0.7;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #lightbox video {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>My Video Gallery</h1>

  <div class="gallery">
    <div class="video-thumb" data-src="videos/v1.mp4">
      <img src="https://picsum.photos/id/1011/600/400" alt="Video 1">
    </div>
    <div class="video-thumb" data-src="videos/v2.mp4">
      <img src="https://picsum.photos/id/1015/600/400" alt="Video 2">
    </div>
    <div class="video-thumb" data-src="https://www.w3schools.com/html/mov_bbb.mp4">
      <img src="https://picsum.photos/id/1025/600/400" alt="Video 3">
    </div>
  </div>

  <!-- Lightbox Container -->
  <div id="lightbox">
    <video controls autoplay></video>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const video = lightbox.querySelector('video');
    const thumbnails = document.querySelectorAll('.video-thumb');

    thumbnails.forEach(thumb => {
      thumb.addEventListener('click', () => {
        const src = thumb.getAttribute('data-src');
        video.src = src;
        lightbox.style.display = 'flex';
      });
    });

    // Close lightbox when clicking outside video
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
        video.pause();
        video.currentTime = 0;
        video.src = ''; // clear video
      }
    });
  </script>

</body>
</html>
