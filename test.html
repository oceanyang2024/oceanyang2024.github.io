<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo & Video Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      padding: 1em;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .gallery img,
    .gallery video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s;
      background: #000;
    }
    .gallery img:hover,
    .gallery video:hover {
      transform: scale(1.03);
    }

    /* Shared Lightbox Styles */
    #lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #lightbox-content {
      max-width: 90%;
      max-height: 90%;
    }

    #lightbox img,
    #lightbox video {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    #lightbox video {
      max-height: 90vh;
    }
  </style>
</head>
<body>

  <h1>Photo & Video Gallery</h1>

  <div class="gallery">
    <!-- Images -->
    <img src="https://picsum.photos/id/1011/600/400" alt="Sample 1">
    <img src="https://picsum.photos/id/1015/600/400" alt="Sample 2">

    <!-- Videos -->
    <video data-src="videos/v1.mp4" poster="videos/v1.mp4">
      Your browser does not support video.
    </video>
    <video data-src="https://www.w3schools.com/html/movie.mp4" poster="https://picsum.photos/id/1070/600/400">
      Your browser does not support video.
    </video>

    <!-- More Images -->
    <img src="photos/p1.jpg" alt="Sample 3">
    <img src="https://picsum.photos/id/1050/600/400" alt="Sample 4">
  </div>

  <!-- Lightbox Overlay -->
  <div id="lightbox">
    <div id="lightbox-content"></div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const content = document.getElementById('lightbox-content');

    // Open image in lightbox
    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        content.innerHTML = `<img src="${img.src}" alt="Full Image">`;
        lightbox.style.display = 'flex';
      });
    });

    // Open video in lightbox
    document.querySelectorAll('.gallery video').forEach(video => {
      video.addEventListener('click', () => {
        const src = video.getAttribute('data-src');
        content.innerHTML = `
          <video src="${src}" controls autoplay></video>
        `;
        lightbox.style.display = 'flex';
      });
    });

    // Close lightbox on click outside content
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
        content.innerHTML = ''; // Stop video/audio playback
      }
    });
  </script>

</body>
</html>
