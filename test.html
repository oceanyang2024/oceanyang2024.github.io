<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .video-card {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    video {
      width: 100%;
      border-radius: 6px;
    }
    .title {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>My Video Gallery</h1>

  <div class="gallery" id="videoGallery"></div>

  <script>
    // Array of video data (use your own video file URLs or links here)
    const videos = [
      { title: "Nature Walk", src: "video1.mp4" },
      { title: "Ocean", src: "videos/v2.mp4" },
      { title: "Ocean Waves", src: "video3.mp4" }
    ];

    const gallery = document.getElementById('videoGallery');

    videos.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const vid = document.createElement('video');
      vid.src = video.src;
      vid.controls = true;

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = video.title;

      card.appendChild(vid);
      card.appendChild(title);
      gallery.appendChild(card);
    });
  </script>

</body>
</html>
